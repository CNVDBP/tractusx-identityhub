name: Build IdentityHub token patch
description: Build the pinned SI token compatibility patch without replacing RC5 artifacts
runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: eclipse-edc/IdentityHub
        ref: f3bbaf90468472e646f0929b72d42d33f7641fc6
        path: .gradle/identityhub-token-patch-source
        persist-credentials: false
    - name: Build patched dependencies
      shell: bash
      run: python3 tools/identityhub-token-patch/build.py .gradle/identityhub-token-patch-source
